[default.extend-words]
Ded = "Ded"
ons = "ons"
ist = "ist"
WITHO = "WITHO"

[default]
extend-ignore-re = [
    # *sigh* this just isn't worth the cost of fixing
    "sha256:.*",
    "(?:^|[^[:alnum:]_.-])@nce3xin(?:$|[^[:alnum:]_.-])",
]

[files]
extend-exclude = ["vendor/", "go.mod", "CHANGELOG.md"]
